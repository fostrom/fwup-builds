name: build

on:
  push: { branches: [main] }
  workflow_dispatch:

permissions: { contents: read }

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      tag: "${{ steps.tag.outputs.tag }}"
      deps: "${{ steps.tag.outputs.deps }}"
      publish: "${{ steps.tag.outputs.publish }}"
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - id: tag
        run: |
          tag=$(gh release view -R fwup-home/fwup --json tagName -q .tagName)
          deps=$(gh api "repos/fwup-home/fwup/contents/scripts/third_party_versions.sh?ref=$tag" -q .sha)
          publish=true
          case $(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null) in
            true) ;;
            false) publish=false ;;
            *) gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
                 --title "fwup ${tag#v}" --notes "fwup ${tag#v} from https://github.com/fwup-home/fwup/releases/tag/$tag" ;;
          esac
          printf 'tag=%s\ndeps=%s\npublish=%s\n' "$tag" "$deps" "$publish" >> "$GITHUB_OUTPUT"

  linux:
    needs: tag
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env: { TAG: "${{ needs.tag.outputs.tag }}", AR: zig ar, RANLIB: zig ranlib }
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - uses: actions/cache@v6
        with: { path: deps, key: "deps-v1-linux-zig-0.16.0-${{ needs.tag.outputs.deps }}" }
      - run: |
          b() { ./build.sh "$TAG" "$@" > "$1.log" 2>&1 || { cat "$1.log"; exit 1; }; }
          b linux-amd64 x86_64-linux-musl zig cc -target x86_64-linux-musl & p=($!)
          b linux-arm64 aarch64-linux-musl zig cc -target aarch64-linux-musl & p+=($!)
          b windows-amd64 x86_64-w64-mingw32 zig cc -target x86_64-windows-gnu & p+=($!)
          b windows-arm64 aarch64-w64-mingw32 zig cc -target aarch64-windows-gnu & p+=($!)
          b linux-riscv64 riscv64-linux-musl zig cc -target riscv64-linux-musl & p+=($!)
          b freebsd-amd64 x86_64-unknown-freebsd zig cc -target x86_64-freebsd & p+=($!)
          b freebsd-arm64 aarch64-unknown-freebsd zig cc -target aarch64-freebsd & p+=($!)
          for pid in "${p[@]}"; do wait "$pid"; done
      # LICENSES
      - run: |
          src=build/linux-amd64 deps=build/linux-amd64/build/x86_64-linux-musl/deps zig=$(dirname "$(command -v zig)")
          add() { mkdir -p "LICENSES/$1" && cp "$2" "LICENSES/$1/"; }
          add fwup "$src/LICENSE"
          for f in "$src"/src/3rdparty/*/LICEN[CS]E* "$deps"/*/LICENSE "$deps"/*/COPYING; do
            add "$(basename "$(dirname "$f")")" "$f"
          done
          add zig "$zig/LICENSE"
          add musl "$zig/lib/libc/musl/COPYRIGHT"
          add mingw-w64 "$zig/lib/libc/mingw/COPYING"
          add freebsd "$zig/lib/libc/freebsd/COPYRIGHT"
          tar -czf dist/LICENSES.tar.gz LICENSES
      - if: needs.tag.outputs.publish == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber

  macos:
    needs: tag
    runs-on: macos-latest
    permissions: { contents: write }
    env:
      TAG: "${{ needs.tag.outputs.tag }}"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with: { path: deps, key: "deps-v1-macos-${{ needs.tag.outputs.deps }}" }
      - run: |
          brew install autoconf automake libtool coreutils
          b() { ./build.sh "$TAG" "$@" > "$1.log" 2>&1 || { cat "$1.log"; exit 1; }; }
          b macos-amd64 x86_64-apple-darwin clang -arch x86_64 & p=($!)
          b macos-arm64 aarch64-apple-darwin clang -arch arm64 & p+=($!)
          for pid in "${p[@]}"; do wait "$pid"; done
      - if: needs.tag.outputs.publish == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber

  release:
    if: needs.tag.outputs.publish == 'true'
    needs: [tag, linux, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    env: { TAG: "${{ needs.tag.outputs.tag }}", GH_TOKEN: "${{ github.token }}" }
    steps:
      - run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          cd dist && sha256sum -- fwup-* LICENSES.tar.gz > SHA256SUMS
      - uses: actions/attest@v4
        with: { subject-path: "dist/fwup-*" }
      - run: |
          gh release upload "$TAG" dist/SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
